code: ["483920", "117204", "902561", "774108"]
family_name: [Andrei, Mihai, Elena]
phone_unknown: ["+40 700 000 111", "+40 700 000 222", "+40 700 000 333"]

# Fictional first names used in neutral / SAFE texts.
first_name: [Ana, Radu, Ioana, George]
# Real-looking item names for marketplace.
