# Kiro 2 templates: family, investment, romance, job, prize, other (+ SAFE look-alikes,
# SAFE hard negatives and harmless thread openers). Uses only slots from ../slots.yaml.
#
# Label rules for SCAM templates (a cue in the text means the flag must be listed):
#   {fake_link}                                         -> RF_SUSPICIOUS_CONTACT
#   organisation name speaks as the sender              -> RF_IMPERSONATION
#   azi / acum / urgent / în {deadline} / locuri limitate / expiră -> RF_URGENCY
#   blocat / suspendat / deconectăm / amendă / dosar / virus       -> RF_THREAT
#   negated or warning-only mention ("nu comunicați codul")        -> no request flag
#
# HARD NEGATIVES and OPENERS are the exception on purpose: hard negatives contain the cue words
# (money, code, accident, urgency, link) yet carry flags [] so the model learns that context
# decides, not keywords. Openers are the harmless first message of a scam thread: type is the
# scam it opens, flags only what is literally present.

# ======================= FAMILY_EMERGENCY =======================
- type: FAMILY_EMERGENCY
  flags: [RF_NEW_NUMBER, RF_PAYMENT_REQUEST, RF_URGENCY, RF_SECRECY]
  text: "Mamă, sunt {family_name}, am alt număr: {phone_unknown}. Trimite-mi {amount} urgent și nu spune nimănui."
- type: FAMILY_EMERGENCY
  flags: [RF_NEW_NUMBER, RF_PAYMENT_REQUEST, RF_EMOTIONAL_PRESSURE]
  text: "Tata, am avut un accident cu mașina, telefonul meu e stricat. Te rog trimite {amount} pe numărul ăsta nou: {phone_unknown}."
- type: FAMILY_EMERGENCY
  flags: [RF_NEW_NUMBER, RF_URGENCY, RF_PAYMENT_REQUEST, RF_SECRECY]
  text: "Salut tată, sunt {family_name}. Mi-am pierdut telefonul și scriu de la un număr nou, {phone_unknown}. Sunt la poliție și am nevoie acum de {amount} pentru o taxă. Nu-i spune mamei, o sperii."
- type: FAMILY_EMERGENCY
  flags: [RF_NEW_NUMBER, RF_PAYMENT_REQUEST, RF_SECRECY]
  text: "Bunicule, sunt nepotul dvs., {family_name}. Am un număr nou, {phone_unknown}. Am nevoie de {amount} pentru o problemă grea, vă rog nu spuneți părinților."
- type: FAMILY_EMERGENCY
  flags: [RF_PAYMENT_REQUEST, RF_URGENCY, RF_SUSPICIOUS_CONTACT]
  text: "Mamă, sunt {family_name}. Am rămas fără bani pe card, plătește-mi biletul acum pe {fake_link}"

# ======================= INVESTMENT =======================
- type: INVESTMENT
  flags: [RF_TOO_GOOD, RF_URGENCY, RF_PAYMENT_REQUEST, RF_SUSPICIOUS_CONTACT]
  text: "Investiție garantată: dublați {amount} în 7 zile. Locuri limitate, înscrieți-vă în {deadline}: {fake_link}"
- type: INVESTMENT
  flags: [RF_TOO_GOOD, RF_SUSPICIOUS_CONTACT, RF_PAYMENT_REQUEST]
  text: "Profit sigur de 300% din criptomonede. Depuneți {amount} și vă contactăm noi. Scrieți la {fake_link}"
- type: INVESTMENT
  flags: [RF_TOO_GOOD, RF_PAYMENT_REQUEST, RF_CHANNEL_SWITCH]
  text: "Salut, un prieten de-al meu a făcut 10.000 lei într-o lună cu platforma asta de criptomonede. Bagă și tu {amount}, câștigul e sigur. Scrie-mi pe WhatsApp și îți dau detalii."
- type: INVESTMENT
  flags: [RF_IMPERSONATION, RF_TOO_GOOD, RF_PAYMENT_REQUEST, RF_URGENCY]
  text: "Bună ziua, sunt consultant la {bank}. Vă oferim un depozit special cu dobândă de 40% pe an, fără risc. Pentru a rezerva locul, virați {amount} azi."
- type: INVESTMENT
  flags: [RF_TOO_GOOD, RF_URGENCY, RF_PAYMENT_REQUEST]
  text: "Ultima șansă! Dacă investiți {amount} acum, primiți dublu. Oferta expiră în {deadline}."

# ======================= ROMANCE =======================
- type: ROMANCE
  flags: [RF_EMOTIONAL_PRESSURE, RF_PAYMENT_REQUEST, RF_SECRECY]
  text: "Dragostea mea, nu am mai întâlnit pe nimeni ca tine. Am o problemă cu viza și am nevoie de {amount}. Să rămână între noi."
- type: ROMANCE
  flags: [RF_EMOTIONAL_PRESSURE, RF_NEW_NUMBER, RF_PAYMENT_REQUEST]
  text: "Te iubesc. Îți scriu de pe alt număr {phone_unknown} pentru că mi s-a stricat cardul. Poți trimite {amount}?"
- type: ROMANCE
  flags: [RF_EMOTIONAL_PRESSURE, RF_CHANNEL_SWITCH]
  text: "Bună, scumpo. Sunt medic pe o navă și nu am semnal bun. Hai să vorbim pe WhatsApp, aici nu pot să-ți scriu liber. Simt că te cunosc de o viață."
- type: ROMANCE
  flags: [RF_EMOTIONAL_PRESSURE, RF_PAYMENT_REQUEST]
  text: "Stimată doamnă, sufletul dvs. m-a cucerit de la prima conversație. Vă rog, ajutați-mă cu {amount} pentru biletul de avion și vă promit că vom fi împreună."
- type: ROMANCE
  flags: [RF_EMOTIONAL_PRESSURE, RF_PAYMENT_REQUEST, RF_SUSPICIOUS_CONTACT, RF_SECRECY]
  text: "Iubire, am luat biletul ca să vin la tine, dar trebuie să plătești taxa de {amount} aici: {fake_link} Nu spune nimănui, vreau să fie surpriză."

# ======================= JOB_OFFER =======================
- type: JOB_OFFER
  flags: [RF_TOO_GOOD, RF_PAYMENT_REQUEST, RF_SUSPICIOUS_CONTACT, RF_URGENCY]
  text: "Angajăm de acasă, {amount} pe zi, fără experiență. Plătiți taxa de activare și începeți azi: {fake_link}"
- type: JOB_OFFER
  flags: [RF_TOO_GOOD, RF_DATA_REQUEST, RF_URGENCY, RF_SUSPICIOUS_CONTACT]
  text: "Felicitări, ați fost selectat pentru un post bine plătit. Trimiteți CNP și date cont în {deadline} aici: {fake_link}"
- type: JOB_OFFER
  flags: [RF_IMPERSONATION, RF_TOO_GOOD, RF_DATA_REQUEST]
  text: "{courier}: Căutăm curieri cu program flexibil. Câștigați {amount} pe zi. Trimiteți-ne seria buletinului și IBAN-ul ca să vă facem contractul."
- type: JOB_OFFER
  flags: [RF_TOO_GOOD, RF_CHANNEL_SWITCH]
  text: "Salut! Ai chef de un job ușor, 200 lei pe oră, de pe telefon? Scrie-mi pe WhatsApp."
- type: JOB_OFFER
  flags: [RF_TOO_GOOD, RF_PAYMENT_REQUEST]
  text: "Ați fost angajat cu salariu de 8.000 lei, fără interviu. Pentru uniformă și instruire, virați {amount} în contul nostru înainte de prima zi de lucru."

# ======================= PRIZE_LOTTERY =======================
- type: PRIZE_LOTTERY
  flags: [RF_TOO_GOOD, RF_URGENCY, RF_PAYMENT_REQUEST, RF_SUSPICIOUS_CONTACT]
  text: "Ați câștigat {amount}! Pentru a ridica premiul plătiți taxa de livrare în {deadline}: {fake_link}"
- type: PRIZE_LOTTERY
  flags: [RF_IMPERSONATION, RF_TOO_GOOD, RF_DATA_REQUEST, RF_SUSPICIOUS_CONTACT]
  text: "{shop}: Sunteți câștigătorul tombolei! Confirmați datele contului pentru a primi premiul: {fake_link}"
- type: PRIZE_LOTTERY
  flags: [RF_TOO_GOOD, RF_DATA_REQUEST]
  text: "Felicitări! Ai câștigat un telefon nou. Răspunde cu numele și adresa ta ca să ți-l trimitem."
- type: PRIZE_LOTTERY
  flags: [RF_IMPERSONATION, RF_TOO_GOOD, RF_URGENCY, RF_PAYMENT_REQUEST]
  text: "{shop}: La tragerea la sorți de azi, numărul dvs. a fost extras. Pentru a primi voucherul de {amount}, achitați o taxă de procesare de 15 lei prin transfer."
- type: PRIZE_LOTTERY
  flags: [RF_TOO_GOOD, RF_CODE_REQUEST, RF_URGENCY]
  text: "Ați câștigat o excursie! Pentru confirmare, trimiteți-ne codul pe care îl veți primi prin mesaj, în {deadline}."

# ======================= OTHER =======================
- type: OTHER
  flags: [RF_URGENCY, RF_PAYMENT_REQUEST, RF_THREAT, RF_SUSPICIOUS_CONTACT]
  text: "Factura la curent este restantă. Dacă nu plătiți {amount} în {deadline}, vă deconectăm. Plată aici: {fake_link}"
- type: OTHER
  flags: [RF_DATA_REQUEST, RF_URGENCY, RF_THREAT, RF_SUSPICIOUS_CONTACT]
  text: "Verificare de securitate: confirmați adresa și data nașterii în {deadline} sau contul va fi suspendat: {fake_link}"
- type: OTHER
  flags: [RF_PAYMENT_REQUEST, RF_URGENCY, RF_EMOTIONAL_PRESSURE]
  text: "Bună! Strângem bani pentru un copil bolnav, orice sumă ajută. Trimite {amount} acum la contul din mesajul următor."
- type: OTHER
  flags: [RF_TOO_GOOD, RF_PAYMENT_REQUEST, RF_URGENCY]
  text: "Apartament de închiriat, preț foarte mic. Pentru a-l rezerva trimiteți un avans de {amount} înainte de vizionare, nu mai avem decât azi."
- type: OTHER
  flags: [RF_PAYMENT_REQUEST]
  text: "Bună ziua, am găsit un portofel cu actele dvs. Trimiteți {amount} pentru transport și vi-l aduc."

