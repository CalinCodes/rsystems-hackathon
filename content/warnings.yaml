# Scam Shield — warning texts (owner: Kiro 2).
#
# Keyed by scamType, then by the strongest flag in the thread. buildWarning() picks
# warnings[scamType][strongestFlag]; if that flag has no entry it falls back to
# warnings[scamType]._default.
#
# Rules (CLAUDE.md): Romanian first, formal "dumneavoastră", max 3 short sentences,
# no jargon. Exactly one action via an OFFICIAL channel from contracts/catalog.json.
# Never repeat a link or phone number that appeared in the message.
#
# Official channels available (contracts/catalog.json):
#   Banca Dunărea  — 0800 100 200 / bancadunarea.ro
#   CurierExpres   — 0800 300 400 / curierexpres.ro
#   PiațaMea       — piatamea.ro (no phone)
#   MegaShop       — 0800 500 600 / megashop.ro
#   ANAF           — 031 403 91 60 / anaf.ro

BANK_IMPERSONATION:
  _default:
    ro: "Atenție! Acest mesaj pare o înșelătorie bancară. O bancă adevărată nu vă cere date sau coduri așa. Nu apăsați niciun link."
    en: "Warning! This looks like a bank scam. A real bank never asks for your details or codes this way. Do not tap any link."
    action: "Sunați Banca Dunărea la 0800 100 200, numărul de pe cardul dumneavoastră."
  RF_CODE_REQUEST:
    ro: "Atenție! Cineva se dă drept banca dumneavoastră și vă cere un cod. Niciun angajat real nu cere coduri. Nu spuneți codul nimănui."
    en: "Warning! Someone is posing as your bank and asking for a code. No real employee asks for codes. Do not tell the code to anyone."
    action: "Sunați Banca Dunărea la 0800 100 200, numărul de pe cardul dumneavoastră."
  RF_THREAT:
    ro: "Atenție! Mesajul vă sperie ca să acționați repede. Banca nu blochează conturi prin SMS cu linkuri. Nu apăsați nimic."
    en: "Warning! The message scares you into acting fast. A bank does not block accounts via SMS links. Do not tap anything."
    action: "Sunați Banca Dunărea la 0800 100 200, numărul de pe cardul dumneavoastră."
  RF_DATA_REQUEST:
    ro: "Atenție! Cineva cere datele contului dumneavoastră. Banca nu cere niciodată așa ceva prin mesaj. Nu trimiteți nicio informație."
    en: "Warning! Someone is asking for your account details. A bank never asks for these by message. Do not send any information."
    action: "Sunați Banca Dunărea la 0800 100 200, numărul de pe cardul dumneavoastră."

